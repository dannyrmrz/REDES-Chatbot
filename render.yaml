services:
  - type: web
    name: clinic-mcp-server
    runtime: python
    plan: free
    region: oregon
    # The server itself only uses the standard library, but it imports the
    # mcp_host package for the JSON-RPC layer, and importing that package pulls
    # in the LLM SDK. Installing the requirements keeps the import chain happy.
    buildCommand: pip install -r requirements.txt
    startCommand: python -m clinic_server.http_server
    healthCheckPath: /health
